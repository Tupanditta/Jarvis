# Catálogo de aplicaciones y páginas que se pueden abrir con «abre {nombre}».
# También se edita desde la ventana Catálogo de la pantalla de sesión. Guía: PERSONALIZAR.md, en la raíz del repositorio.

# Añadir al catálogo las aplicaciones del menú Inicio.
discover_installed_apps = true

# Una aplicación: nombre que se escribe, otras formas de escribirlo, y qué se lanza
# (ejecutable, acceso directo o nombre en el PATH). Quite los «#» y adáptelo:
#
# [[apps]]
# name = "Visual Studio Code"
# aliases = ["code", "vs code", "el editor"]
# path = "C:/Users/usuario/AppData/Local/Programs/Microsoft VS Code/Code.exe"
# args = []

# Una página: se abre en Microsoft Edge. Quite los «#» y adáptela:
#
# [[pages]]
# name = "Documentación"
# aliases = ["docs", "la documentación"]
# url = "https://example.com/docs"
