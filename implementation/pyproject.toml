[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-voz-personal"
version = "1.0.0.dev0"
description = "Asistente personal local"
requires-python = ">=3.11"
# Dependencias de software/arquitectura.md, sección 9.
dependencies = [
    "PySide6>=6.7",
    "piper-tts>=1.3.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "APScheduler>=3.10,<4",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.2",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_assistant = [
    "core/migrations/*.sql",
    "resources/config_defaults/*.toml",
    "ui/qml/qmldir",
    "ui/qml/*.qml",
    "ui/qml/*/*.qml",
    "ui/qml/*/*.js",
    "ui/assets/fonts/*",
    "ui/assets/icons/*",
    "ui/assets/sounds/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
timeout = 30
markers = [
    "models: requiere los modelos reales descargados",
    "hardware: requiere altavoz o escritorio reales",
]
addopts = "-m \"not models and not hardware\""

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["legacy", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # comillas y signos del español en cadenas
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["jarvis_assistant", "fakes", "fetch_models"]
